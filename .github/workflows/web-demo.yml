# Build the Emscripten/WASM browser port and publish it as a playable demo on
# GitHub Pages.
#
# This workflow is intentionally self-contained: the only external download is
# the pinned Emscripten SDK.  It runs tools/build_web.sh (the same script
# developers use), smoke-tests the freshly built module with Node, then
# uploads build/web/ as the Pages artifact, deploys it, and finally opens the
# deployed URL with Python Playwright to prove the published site boots the
# wasm engine (the live-demo check skips the JAR step in CI because tests/games/
# is git-ignored; local runs with a corpus play a real game).
#
# One-time setup for a fork or a new clone of this repository: Settings ->
# Pages -> Build and deployment -> Source: "GitHub Actions".  Without that the
# deploy job fails with "Ensure GitHub Pages has been enabled"; the
# configure-pages step below checks it early so a missing site fails before the
# wasm build instead of after it.  The deployed URL is
# https://<owner>.github.io/nano_j2me/ (custom domains work the same way).
#
# The demo ships no game JARs - users import their own files into the local
# library.  The site is a full PWA, so once opened it also works offline.

name: Web demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'web/**'
      - 'tools/build_web.sh'
      - 'tools/web_test/**'
      - '.github/workflows/web-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let the current Pages transaction finish before deploying the latest push.
  cancel-in-progress: false

jobs:
  build:
    name: build and smoke-test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          # The version tools/emsdk_setup.sh installs for local builds; keep
          # them in sync so a CI artifact matches a local one byte for byte
          # (the wasm build is path-reproducible since the prefix-map fix).
          version: 7.0.0
          actions-cache-folder: emsdk-cache

      - name: Build the browser port
        run: tools/build_web.sh

      - name: Smoke-test the built module
        run: node tools/web_test/web_smoke_test.mjs --evidence .local-tools/debug-runs/web-demo

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # deploy-pages polls an accepted deployment, but a 5xx while creating
      # it ends the action immediately. Reuse this run's uploaded artifact.
      - name: Back off after a failed deployment
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        run: sleep 20
      - name: Retry Pages deployment
        id: retry
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v5

  verify:
    name: verify the deployed demo
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright (Firefox)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright
          python3 -m playwright install --with-deps firefox

      - name: Open the deployed demo in a real browser
        run: |
          # Pages may still serve the previous deployment for a moment; the
          # script reloads with cache-busting URLs before it fails.
          python3 tools/web_test/web_live_check.py \
            --url "${{ needs.deploy.outputs.page_url }}" \
            --boot-retries 5 \
            --evidence .local-tools/debug-runs/web-live-ci

      - name: Upload live-demo evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-demo-check
          path: .local-tools/debug-runs/web-live-ci
          if-no-files-found: warn
